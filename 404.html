<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <script>
    var path = window.location.pathname;
    if (path.indexOf('/observations/') === 0) {
      var slug = path.replace('/observations/', '').replace(/\/$/, '');
      window.location.replace('/observations/?p=' + slug);
    } else {
      window.location.replace('/');
    }
  </script>
</head>
<body></body>
</html>
